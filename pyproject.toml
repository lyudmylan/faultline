[project]
name = "faultline"
version = "0.1.0"
description = "A small, deliberately unreliable HTTP service for exercising incident-response and observability tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
faultline = "faultline.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.100",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=faultline --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["faultline"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
